<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ココナラ小遣い稼ぎOS</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="logo">⚙️</div><h1>ココナラ小遣い稼ぎOS</h1><p>案件・納期・売上をどこからでも。</p>
    <input id="authEmail" type="email" autocomplete="email" placeholder="メールアドレス">
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）">
    <button class="primary" id="signInBtn">ログイン</button>
    <button id="signUpBtn">初回アカウント作成</button>
    <div id="authMsg" class="msg"></div>
  </div>
</div>
<div id="appView" class="hidden">
<header><div><h1>ココナラ小遣い稼ぎOS</h1><div class="sub">クラウド案件管理</div></div><div class="head-actions"><button id="refreshBtn">↻</button><button class="primary" id="newBtn">＋ 新規</button></div></header>
<main>
  <section class="kpis"><div class="card"><span>進行中</span><b id="kActive">0</b></div><div class="card"><span>相談案件</span><b id="kConsult">0</b></div><div class="card"><span>売上見込</span><b id="kSales">¥0</b></div><div class="card"><span>手取り見込</span><b id="kNet">¥0</b></div></section>
  <section class="toolbar"><select id="filterStatus"><option value="">全ステータス</option><option>相談受付</option><option>要件整理</option><option>見積提示</option><option>購入済</option><option>開発中</option><option>テスト</option><option>修正</option><option>納品待ち</option><option>完了</option></select><input id="search" placeholder="顧客名・案件名で検索"><button id="logoutBtn">ログアウト</button></section>
  <section id="caseList" class="case-list"></section>
</main>
</div>
<div id="modal" class="modal"><div class="modalbox"><div class="modal-head"><h2 id="modalTitle">新規案件</h2><button id="closeBtn">×</button></div>
<form id="caseForm"><input type="hidden" id="caseId"><div class="formgrid">
<label>顧客名<input id="customer" required></label><label>案件名<input id="title" required></label>
<label>ステータス<select id="status"><option>相談受付</option><option>要件整理</option><option>見積提示</option><option>購入済</option><option>開発中</option><option>テスト</option><option>修正</option><option>納品待ち</option><option>完了</option></select></label>
<label>案件種別<select id="caseType"><option>3,000円相談</option><option>本制作</option><option>その他</option></select></label>
<label>金額<input id="amount" type="number" min="0" step="100" value="3000"></label><label>手数料率(%)<input id="feeRate" type="number" min="0" max="100" step="0.1" value="22"></label>
<label>納期<input id="dueDate" type="date"></label><label>最終連絡日<input id="lastContactDate" type="date"></label>
<label class="full">次にやること<input id="nextAction"></label><label class="full">メモ<textarea id="memo"></textarea></label><label class="full">ココナラURL<input id="coconalaUrl" type="url"></label>
</div><div class="form-actions"><button type="button" class="danger hidden" id="deleteBtn">削除</button><span></span><button type="button" id="cancelBtn">キャンセル</button><button type="submit" class="primary">保存</button></div></form></div></div>
<script src="./app.js"></script>
</body></html>
